# ----------------------------------------------------------------------
# TAVARDT Elite OpenLiteSpeed Tuning
# ----------------------------------------------------------------------
# Instructions: This configuration should be applied directly in the 
# OpenLiteSpeed WebAdmin Console (Port 7080) under "Server Configuration -> Tuning".
# 
# WARNING: Values below are optimized for servers with at least 8GB RAM.
# ----------------------------------------------------------------------

# 1. Connection Limits (Prevent connection drops during traffic spikes)
Max Connections: 10000
Max SSL Connections: 10000
Connection Timeout (secs): 60
Keep-Alive Timeout (secs): 5
Max Keep-Alive Requests: 10000

# 2. Smart Keep-Alive
# Helps mitigate slow-reading HTTP attacks (Slowloris)
Smart Keep-Alive: Yes

# 3. Static File Caching
# Dramatically speeds up TTFB for static assets by keeping them in RAM
Static File Delivery System: AIO
Max Cached Small File Size (bytes): 102400
Total Small File Cache Size (bytes): 51200000
Max MMAP File Size (bytes): 10485760
Total MMAP Cache Size (bytes): 209715200

# 4. GZIP & Brotli Compression
# CyberPanel defaults are sometimes too low.
Enable Compression: Yes
Enable GZIP Dynamic Compression: Yes
Compression Level (Dynamic): 3
Enable Brotli: Yes
Brotli Compression Level: 3

# 5. PHP Tuning (lsphp)
# Ensure the PHP external app has enough capacity to handle sudden bursts.
# Located under: Server Configuration -> External App -> lsphpXX
Max Connections: 500
Initial Request Timeout (secs): 60
Retry Timeout (secs): 0
